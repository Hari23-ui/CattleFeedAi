# =============================================================================
# CattleFeedAI — Render Infrastructure as Code Blueprint
# Database Provider: Supabase Managed PostgreSQL (External Managed Service)
# Reference: https://render.com/docs/blueprint-spec
# =============================================================================
# Architecture:
#   1. cattlefeedai-ai       : FastAPI AI Microservice (Python, Uvicorn, Visual CV)
#   2. cattlefeedai-backend  : Spring Boot 3.2.5 REST API (Java 17, Docker multi-stage)
#   3. cattlefeedai-frontend : Expo / React Native Web Static Site (type: web, runtime: static)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI AI Screening Service (Visual Quality & Anomaly Screening)
  # ---------------------------------------------------------------------------
  - type: web
    name: cattlefeedai-ai
    runtime: python
    rootDir: ai-service
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_IMAGE_SIZE_MB
        value: "10"
      - key: MODEL_ENABLED
        value: "false"

  # ---------------------------------------------------------------------------
  # 2. Spring Boot Backend REST API (Java 17 / Spring Boot 3.2.5)
  # ---------------------------------------------------------------------------
  - type: web
    name: cattlefeedai-backend
    runtime: docker
    rootDir: backend/cattle-feed-api
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: AI_SERVICE_HOST
        fromService:
          type: web
          name: cattlefeedai-ai
          property: host
      - key: AI_SERVICE_PORT
        fromService:
          type: web
          name: cattlefeedai-ai
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_UPLOAD_DIR
        value: uploads/sample-images

  # ---------------------------------------------------------------------------
  # 3. Expo / React Native Web Frontend (Static Site on Render CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: cattlefeedai-frontend
    runtime: static
    rootDir: frontend/cattle-feed-app
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: EXPO_PUBLIC_API_BASE_URL
        sync: false
