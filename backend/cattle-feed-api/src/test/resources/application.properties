# ===================================================================
# CattleFeedAI - Test Configuration (Supabase PostgreSQL)
# Directly connects to Supabase PostgreSQL for Maven test execution.
# Safety: Strictly requires DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD.
# Fails fast if any database environment variable is missing.
# Never falls back to H2, MySQL, or localhost.
# Never modifies or drops Supabase schema (ddl-auto=none).
# ===================================================================
spring.application.name=cattle-feed-api-test

# Supabase PostgreSQL datasource configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate configuration for PostgreSQL
# SAFETY: 'none' by default ensures Hibernate does not execute CREATE, ALTER, or DROP statements.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security & Service test configurations
jwt.secret=${JWT_SECRET:Y2F0dGxlZmVlZGFpLWRldi1zZWNyZXQta2V5LTI1Ni1iaXQtbG9uZy1lbm91Z2gtZm9yLWhtYWM=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:3000}

sms.enabled=false
sms.provider=mock
