# ===================================================================
# CattleFeedAI - Application Configuration
# ===================================================================

spring.application.name=cattle-feed-api

# ===================================================================
# Server Configuration
# ===================================================================
server.port=8080

# ===================================================================
# Database Configuration
# Configure these values via environment variables in production.
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cattlefeedai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sql@2007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# JWT Configuration
# IMPORTANT: Override jwt.secret via environment variable in production.
# ===================================================================
jwt.secret=${JWT_SECRET:Y2F0dGxlZmVlZGFpLWRldi1zZWNyZXQta2V5LTI1Ni1iaXQtbG9uZy1lbm91Z2gtZm9yLWhtYWM=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Logging
# ===================================================================
logging.level.com.cattlefeedai=INFO
logging.level.org.springframework.security=WARN

# ===================================================================
# Swagger / OpenAPI (Springdoc) Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false

# ===================================================================
# AI Service Integration (FastAPI Microservice)
# ===================================================================
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:3000}
