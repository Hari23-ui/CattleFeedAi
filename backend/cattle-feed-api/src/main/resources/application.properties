# ===================================================================
# CattleFeedAI - Application Configuration
# ===================================================================

spring.application.name=cattle-feed-api

# ===================================================================
# Server Configuration (Supports Render/Cloud PORT environment variable)
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# Database Configuration
# Supports DATABASE_URL or component env vars (DB_HOST, DB_PORT, DB_NAME),
# falling back to local development MySQL.
# ===================================================================
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cattlefeedai}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:sql@2007}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# JWT Configuration
# Override JWT_SECRET and JWT_EXPIRATION in production environments.
# ===================================================================
jwt.secret=${JWT_SECRET:Y2F0dGxlZmVlZGFpLWRldi1zZWNyZXQta2V5LTI1Ni1iaXQtbG9uZy1lbm91Z2gtZm9yLWhtYWM=}
jwt.expiration-ms=${JWT_EXPIRATION:${JWT_EXPIRATION_MS:86400000}}

# ===================================================================
# File Upload / Image Storage Directory
# In production cloud environments without persistent disk, files are ephemeral.
# ===================================================================
app.upload.dir=${APP_UPLOAD_DIR:uploads/sample-images}

# ===================================================================
# CORS Configuration
# Supply comma-separated origins via CORS_ALLOWED_ORIGINS in production.
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ===================================================================
# Logging
# ===================================================================
logging.level.com.cattlefeedai=INFO
logging.level.org.springframework.security=WARN

# ===================================================================
# Swagger / OpenAPI (Springdoc) Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false

# ===================================================================
# AI Service Integration (FastAPI Microservice)
# Configurable via AI_SERVICE_URL or AI_SERVICE_BASE_URL.
# ===================================================================
ai.service.base-url=${AI_SERVICE_URL:${AI_SERVICE_BASE_URL:http://localhost:8000}}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:3000}
