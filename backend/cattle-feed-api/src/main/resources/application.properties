# ===================================================================
# CattleFeedAI - Application Configuration
# ===================================================================

spring.application.name=cattle-feed-api

# ===================================================================
# Server Configuration (Supports Render/Cloud PORT environment variable)
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# Database Configuration (Supabase PostgreSQL)
# Strictly requires DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD.
# Supports Supabase pooler (port 6543 / 5432) or direct connection.
# Zero fallback to localhost:5432, MySQL, or H2.
# ===================================================================
spring.datasource.url=${DATABASE_URL:${DB_URL:}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=15000
spring.datasource.hikari.max-lifetime=45000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / Hibernate Configuration (PostgreSQL)
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# JWT Configuration
# Override JWT_SECRET and JWT_EXPIRATION in production environments.
# ===================================================================
jwt.secret=${JWT_SECRET:Y2F0dGxlZmVlZGFpLWRldi1zZWNyZXQta2V5LTI1Ni1iaXQtbG9uZy1lbm91Z2gtZm9yLWhtYWM=}
jwt.expiration-ms=${JWT_EXPIRATION:${JWT_EXPIRATION_MS:86400000}}

# ===================================================================
# File Upload / Image Storage Directory
# In production cloud environments without persistent disk, files are ephemeral.
# ===================================================================
app.upload.dir=${APP_UPLOAD_DIR:uploads/sample-images}

# ===================================================================
# CORS Configuration
# Supply comma-separated origins via CORS_ALLOWED_ORIGINS in production.
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ===================================================================
# Logging
# ===================================================================
logging.level.com.cattlefeedai=INFO
logging.level.org.springframework.security=WARN

# ===================================================================
# Swagger / OpenAPI (Springdoc) Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false

# ===================================================================
# AI Service Integration (FastAPI Microservice)
# Configurable via AI_SERVICE_URL, AI_SERVICE_BASE_URL, or AI_SERVICE_HOST / AI_SERVICE_PORT.
# ===================================================================
ai.service.base-url=${AI_SERVICE_URL:${AI_SERVICE_BASE_URL:http://${AI_SERVICE_HOST:localhost}:${AI_SERVICE_PORT:8000}}}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:3000}
